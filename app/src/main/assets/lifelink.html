<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8E1B1B">
<title>LifeLink</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="libs/leaflet/leaflet.css">
<style>
:root{
  /* Crimson + warm white. Light is the default. */
  --sat:0px;--sab:0px;--sal:0px;--sar:0px;
  --bg:#FFFFFF;--bg2:#FFFFFF;--bg3:#FFF0ED;--fg:#1C2140;--fg2:#6B7089;--line:rgba(28,33,64,.10);
  --accent:#E0343A;--accent-ink:#FFFFFF;--ok:#2E7D5B;--okbg:#E3F3EB;--warn:#A86A0C;--warnbg:#FBF1DC;
  --shadow:0 8px 26px rgba(28,33,64,.10);--tabh:60px;
}
:root[data-theme="dark"]{
  --bg:#190D0C;--bg2:#241312;--bg3:#351B18;--fg:#FBF1EF;--fg2:#C9A39D;--line:rgba(251,241,239,.12);
  --accent:#FF6B5E;--accent-ink:#190D0C;--ok:#5CC49A;--okbg:#14301F;--warn:#E4B15C;--warnbg:#33260E;
  --shadow:0 6px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{font-size:15px;line-height:1.45;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) 28px calc(var(--sal) + 16px);-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.pane.map{padding:0;overflow:hidden}
.pane.map.on{display:block}
#tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal);flex:none}
#tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--fg2)}
#tabs button.on{color:var(--accent);font-weight:600}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}.ic.s{width:16px;height:16px}.ic.m{width:18px;height:18px}.ic.l{width:28px;height:28px}
.layer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;animation:up .22s ease-out}
.layer.modal{background:rgba(20,5,5,.55);justify-content:flex-end;z-index:40;animation:fade .15s}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding:8px calc(var(--sar) + 18px) calc(var(--sab) + 20px) calc(var(--sal) + 18px);animation:up .22s ease-out}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.lscroll{flex:1;overflow-y:auto;padding:0 calc(var(--sar) + 16px) calc(var(--sab) + 24px) calc(var(--sal) + 16px);-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) 8px calc(var(--sal) + 8px);flex:none}
.topbar h2{flex:1;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:active{background:var(--bg3)}
.h1{font-size:26px;font-weight:700;letter-spacing:-.4px}
.h2{font-size:17px;font-weight:650;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between}
.h2 a{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none}
.muted{color:var(--fg2)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:650}.c{text-align:center}
.card{background:var(--bg2);border-radius:16px;padding:14px;border:1px solid var(--line)}
.card.soft{background:var(--bg3);border-color:transparent}
.card.ok{background:var(--okbg);border-color:transparent}
.card.warn{background:var(--warnbg);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:24px;background:var(--bg3);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:18px}
.btn.block{display:flex;width:100%}
.btn:active{filter:brightness(.92);transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--bg2);border:1px solid var(--line);font-size:13px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--fg2);font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.red{background:var(--accent);color:var(--accent-ink)}
.bgb{width:44px;height:44px;border-radius:12px;background:var(--bg3);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.bgb.big{width:64px;height:64px;font-size:22px;border-radius:18px}
.bgb.sm{width:34px;height:34px;font-size:13px;border-radius:10px}
.bgb.fill{background:var(--accent);color:var(--accent-ink)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.seg{display:flex;background:var(--bg3);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--bg2);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:76px;resize:none}
.field .err{color:var(--accent);font-size:12px;margin-top:4px}
.bggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bggrid button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:15px}
.bggrid button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--bg3)}
.opt .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--bg3);font-size:20px;font-weight:700}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.stat{flex:1;text-align:center;padding:12px 6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--fg2)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .t b{font-size:22px}.ring .t span{font-size:10px;color:var(--fg2)}
.sos{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);text-align:left}
.sos .ic{width:30px;height:30px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warnbg);color:var(--fg)}
.banner .ic{color:var(--warn)}
.empty{text-align:center;padding:34px 16px;color:var(--fg2)}
.acc>button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 0;font-weight:600;text-align:left;border-bottom:1px solid var(--line)}
.acc>div{display:none;padding:10px 0 4px;color:var(--fg2);font-size:14px}
.acc.open>div{display:block}
.acc.open>button .ic{transform:rotate(90deg)}
.steps{counter-reset:s}
.steps li{list-style:none;position:relative;padding:0 0 16px 38px;color:var(--fg2);font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg3);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.steps li b{display:block;color:var(--fg);font-size:15px}
.steps{padding:0;margin:0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:20px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translate(-50%,16px);background:#2A1412;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* organ pledge card */
.pcard{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#8E1B1B,#C62828 60%,#E0584B);position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.pcard .n{font-size:20px;font-weight:700;margin:14px 0 2px}
.pcard small{opacity:.8;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.pcard .bgx{position:absolute;right:16px;bottom:14px;font-size:34px;font-weight:800;opacity:.95}
/* map */
#map{position:absolute;inset:0;background:var(--bg3);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
.leaflet-container{font:inherit;background:var(--bg3)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.88)}
.leaflet-marker-icon.mv{transition:transform 2.4s linear}
.leaflet-zoom-anim .leaflet-marker-icon.mv{transition:none}
.mtop{position:absolute;left:0;right:0;top:0;z-index:500;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);pointer-events:none}
.mtop>*{pointer-events:auto}
.mtop .seg{background:var(--bg2);box-shadow:var(--shadow)}
.mtop .chip{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mtop .hscroll{margin:8px -12px 0;padding:2px 12px 6px}
.mfab{position:absolute;right:calc(var(--sar) + 12px);z-index:500;width:46px;height:46px;border-radius:50%;background:var(--bg2);box-shadow:var(--shadow);display:grid;place-items:center}
.mbot{position:absolute;left:0;right:0;bottom:0;z-index:500;padding:0 calc(var(--sar) + 10px) 10px calc(var(--sal) + 10px);pointer-events:none}
.mbot>*{pointer-events:auto}
.mpanel{background:var(--bg2);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 10px;border:1px solid var(--line)}
.mcards{display:flex;gap:10px;overflow-x:auto;margin:8px -12px 0;padding:2px 12px 2px;scrollbar-width:none}
.mcards::-webkit-scrollbar{display:none}
.mcard{flex:none;width:200px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.pin{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 12px system-ui;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);position:relative}
.pin.stale{opacity:.5;filter:saturate(.4)}
.mpanel .btn,.mpanel .chip{white-space:nowrap;flex-shrink:0}
.mpanel #mcount{min-width:0}
.meter{height:6px;border-radius:99px;background:var(--bg3);margin:10px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.mv{transition:none}
.mlive{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 118px);z-index:500;display:flex;align-items:center;gap:6px;font:700 11px system-ui;color:var(--fg2);background:var(--bg2);border:1px solid var(--line);padding:3px 9px 3px 7px;border-radius:999px;box-shadow:var(--shadow)}
.mlive i{width:8px;height:8px;border-radius:50%;background:#B58A00}
.mlive.on{color:#1E7D55}
.mlive.on i{background:#2E9E6F;box-shadow:0 0 0 0 rgba(46,158,111,.6);animation:livepulse 1.8s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(46,158,111,.55)}70%{box-shadow:0 0 0 7px rgba(46,158,111,0)}100%{box-shadow:0 0 0 0 rgba(46,158,111,0)}}
.pin.v::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#2E9E6F;border:2px solid #fff}
.pin.need{background:#fff;color:#C62828;border-color:#C62828}
.pin.crit::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #C62828;animation:ping 1.4s infinite}
.pin.bank{border-radius:9px;background:#33475B;color:#fff;font-size:17px}
.pin.org{border-radius:9px;background:#6D3B8E;color:#fff;font-size:14px}
.pin.camp{border-radius:9px;background:#2E7D5B;color:#fff;font-size:14px}
.pin.sel{transform:scale(1.25);z-index:999}
.meDot{width:20px;height:20px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 0 rgba(26,115,232,.5);animation:pulse 2s infinite}
.meDot.on{background:#2E9E6F;box-shadow:0 0 0 0 rgba(46,158,111,.5);animation:pulseg 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(26,115,232,0)}100%{box-shadow:0 0 0 0 rgba(26,115,232,0)}}
@keyframes pulseg{70%{box-shadow:0 0 0 16px rgba(46,158,111,0)}100%{box-shadow:0 0 0 0 rgba(46,158,111,0)}}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.mattr{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 96px);z-index:500;font-size:10px;color:var(--fg2);background:rgba(255,255,255,.75);padding:1px 6px;border-radius:6px}
:root[data-theme="dark"] .mattr{background:rgba(0,0,0,.5)}
.leaflet-control-container{display:none}
/* Tamil script has tall glyphs and longer words: slightly smaller type and looser leading keep layouts tidy */
:root[lang="ta"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",Latha,sans-serif;font-size:14px;line-height:1.6}
:root[lang="ta"] .h1{font-size:23px;line-height:1.35}
:root[lang="ta"] .h2{font-size:16px}
:root[lang="ta"] .btn{font-size:14px}:root[lang="ta"] .btn.sm{font-size:12.5px}
:root[lang="ta"] .sm{font-size:12.5px}:root[lang="ta"] .xs{font-size:11px}
:root[lang="ta"] #tabs button{font-size:10px}
:root[lang="ta"] .chip,:root[lang="ta"] .tag{font-size:12px}
:root[lang="ta"] .grid4 .xs{font-size:10.5px;line-height:1.4}
:root[lang="ta"] .stat span{font-size:10.5px}
/* ---- "Blood Care" look: white canvas, navy text, coral accent, soft pink tiles, generous rounded cards ---- */
body{letter-spacing:-.003em}
.card{border-radius:20px;border-color:rgba(28,33,64,.07);box-shadow:0 2px 12px rgba(28,33,64,.04)}
.card.soft{box-shadow:none}
.btn{border-radius:16px;min-height:50px}
.btn.primary{box-shadow:0 8px 18px rgba(224,52,58,.24)}
.btn.sm{border-radius:14px;min-height:38px}
.btn.ghost{border-color:rgba(28,33,64,.12)}
.chip{border-radius:14px;border-color:rgba(28,33,64,.10)}
.seg{border-radius:16px}.seg button{border-radius:13px}
.field input,.field select,.field textarea{border-radius:14px;background:#FAFAFD;border-color:rgba(28,33,64,.10)}
:root[data-theme="dark"] .field input,:root[data-theme="dark"] .field select,:root[data-theme="dark"] .field textarea{background:var(--bg2)}
.bgb{border-radius:14px}.bgb.sm{border-radius:11px}
.h1{letter-spacing:-.5px}
.listrow{border-bottom-color:rgba(28,33,64,.07)}
.sheet{border-radius:26px 26px 0 0}
#tabs{border-top:0;box-shadow:0 -8px 28px rgba(28,33,64,.08);border-radius:24px 24px 0 0;padding-top:4px}
#tabs button{height:calc(var(--tabh) + 2px);font-weight:600;gap:3px}
#tabs button .ic{width:46px;height:30px;padding:4px 12px;border-radius:15px;transition:background .15s}
#tabs button.on .ic{background:var(--bg3)}
#toast{background:#1C2140}
.hhead{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;height:52px;padding:0 16px;border-radius:16px;background:#F5F6FA;color:var(--fg2);font-size:14px;margin-top:16px;text-align:left}
:root[data-theme="dark"] .searchbar{background:var(--bg2)}
.hero{position:relative;display:flex;align-items:center;gap:4px;margin-top:14px;padding:18px 8px 18px 18px;border-radius:26px;background:linear-gradient(135deg,#FFF3EE,#FFDFD8);overflow:hidden}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#3A1E1B,#4A2420)}
.hero h3{margin:0 0 6px;font-size:23px;line-height:1.18;font-weight:800;letter-spacing:-.6px}
.hero p{margin:0 0 14px;font-size:13px;color:var(--fg2);max-width:190px}
.hero .art{width:132px;flex:none}.hero .art svg{display:block;width:100%;height:auto}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:20px;background:var(--bg2);border:1px solid rgba(28,33,64,.07);box-shadow:0 2px 12px rgba(28,33,64,.04);text-align:left}
.act .t{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--bg3);color:var(--accent);margin-bottom:6px}
.act b{font-size:14px}.act .s{font-size:12px;color:var(--fg2)}
.act:active{transform:scale(.985)}
.bgt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;border-radius:18px;background:var(--bg3);border:1px solid rgba(224,52,58,.16);font-weight:800;font-size:14px;color:var(--fg)}
.bgt .ic{width:24px;height:24px;color:var(--accent)}
.bgt .tag{font-size:12px;margin-top:2px}

<script>
'use strict';
/* ============ helpers ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '"><use href="#i-' + n + '"/></svg>';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const dayKey = d => { d = d instanceof Date ? d : new Date(d); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const uid = () => Math.random().toString(36).slice(2, 9);
const MONS = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], ta: ['ஜன','பிப்','மார்','ஏப்','மே','ஜூன்','ஜூலை','ஆக','செப்','அக்','நவ','டிச'] };
const MON = new Proxy([], { get: (_, i) => (MONS[LANG] || MONS.en)[i] });
const fmtDate = d => { d = d instanceof Date ? d : new Date(d); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtShort = d => { d = d instanceof Date ? d : new Date(d); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtTime = d => { d = d instanceof Date ? d : new Date(d); const h = d.getHours(); return ((h % 12) || 12) + ':' + pad2(d.getMinutes()) + ' ' + (h < 12 ? 'AM' : 'PM'); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const parseDay = s => new Date(s + 'T00:00:00');
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return Math.round(h / 24) + ' d ago';
}
function inTime(t) {
  const m = Math.round((t - Date.now()) / 60000);
  if (m <= 0) return 'now'; if (m < 60) return 'in ' + m + ' min';
  const h = Math.round(m / 60); if (h < 24) return 'in ' + h + ' h';
  return 'in ' + Math.round(h / 24) + ' d';
}
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

/* ============ config ============ */
// Backend base URL: baked into the Android build (-PapiBase=...), or ?api=... / window.LL_API on the web. Empty = offline demo.
const API = (() => {
  let b = '';
  try { if (window.AndroidBridge && AndroidBridge.apiBase) b = AndroidBridge.apiBase(); } catch (e) {}
  if (!b) {
    try {
      const q = new URLSearchParams(location.search).get('api');      // ?api=https://... (use ?api= to clear)
      if (q !== null) localStorage.setItem('ll.api', q);
      b = window.LL_API || localStorage.getItem('ll.api') || '';
    } catch (e) {}
  }
  return String(b || '').replace(/\/$/, '');
})();
const DEMO = !API;
const HAS_NATIVE = !!window.AndroidBridge;
const HELPLINES = { emergency: '112', ambulance: '108', notto: '1800114770' };

/* ============ storage (always wrapped) ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ll.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ll.' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
  profile: LS.get('profile', null),
  verify: LS.get('verify', { status: 'none' }),
  loc: LS.get('loc', { lat: 13.0827, lng: 80.2707, city: 'Chennai', src: 'default' }),
  settings: Object.assign({ theme: 'light', haptic: true, notify: true, radius: 10, demoBanner: true, lang: 'en' }, LS.get('settings', {})),
  reqs: LS.get('reqs', []),          // requests I created
  offers: LS.get('offers', []),      // blood requests I offered to donate for
  donations: LS.get('donations', []),
  camps: LS.get('camps', []),        // registered camp ids
  organ: Object.assign({ pledged: false, organs: [], tissues: [], kin: {}, witness: {}, informed: false, notto: false, living: {} }, LS.get('organ', {})),
  ui: { tab: 'home', reqSeg: 'near', mapMode: 'donors', need: 'any', fltUrg: 'all', fltCompat: true }
};
const save = k => LS.set(k, S[k]);
let LANG = S.settings.lang === 'ta' ? 'ta' : 'en';

/* ============ i18n: English + Tamil ============
   Static UI text is translated by exact-match lookup in TA (the dictionary near the end of this file), applied to the
   DOM as it renders. Numbers are generalised ("5 km" -> "{n} km") and " · " separated segments are translated one by
   one, so most dynamic strings need no extra code. Text containing names or other data uses t('... {name} ...', {name}). */
const TA = {};
function tr(str) {
  if (LANG !== 'ta') return str;
  if (TA[str] !== undefined) return TA[str];
  const nums = [], sk = str.replace(/\d+(?:\.\d+)?/g, m => { nums.push(m); return '{n}'; });
  if (nums.length && TA[sk] !== undefined) { let i = 0; return TA[sk].replace(/\{n\}/g, () => nums[i++]); }
  if (str.indexOf(' · ') > 0) { const parts = str.split(' · '), out = parts.map(tr); if (out.some((x, i) => x !== parts[i])) return out.join(' · '); }
  return str;
}
function t(key, vars) {
  const s = LANG === 'ta' && TA[key] !== undefined ? TA[key] : key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m) : s;
}
function trNode(n) {
  if (n.nodeType === 3) {
    const v = n.nodeValue, tv = v.trim(); if (!tv) return;
    const out = tr(tv); if (out !== tv) n.nodeValue = v.replace(tv, () => out);
  } else if (n.nodeType === 1 && n.tagName !== 'SCRIPT' && n.tagName !== 'STYLE') {
    ['placeholder', 'aria-label', 'title'].forEach(a => { if (n.hasAttribute(a)) { const v = n.getAttribute(a), o = tr(v); if (o !== v) n.setAttribute(a, o); } });
    n.childNodes.forEach(trNode);
  }
}
function startI18n() {
  document.documentElement.lang = LANG;
  if (LANG !== 'ta') return;
  trNode(document.body);
  new MutationObserver(ms => ms.forEach(m => { if (m.type === 'childList') m.addedNodes.forEach(trNode); else trNode(m.target); }))
    .observe(document.body, { childList: true, subtree: true, characterData: true });
}
function setLang(l) {
  S.settings.lang = l; save('settings');
  if (live()) api('PUT', '/me', { lang: l }).catch(() => {});
  setTimeout(() => location.reload(), 60);
}

/* ============ backend (live mode) ============
   Live mode = an API base URL is configured (Android build -PapiBase, or ?api= on the web). The server is the source of
   truth: every action calls the API, then syncNow() refreshes the same S.* / World.* shapes the screens already read. */
const AUTH = { token: LS.get('token', '') };
const live = () => !DEMO && !!AUTH.token;
const CFG = { gapMen: 90, gapWomen: 120, minAge: 18, maxAge: 65, minWeight: 45, announcement: '', maintenance: false, verifyPolicy: 'digilocker', verifyRequireLicence: false, verifyAllowSkip: true, verifiedDonorsOnly: false };
async function api(method, path, body) {
  let r;
  try {
    r = await fetch(API + '/api' + path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, AUTH.token ? { Authorization: 'Bearer ' + AUTH.token } : {}), body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) { throw Object.assign(new Error('Cannot reach the server. Check your connection.'), { offline: true }); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && AUTH.token) onSessionExpired();
  if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { status: r.status, data: j });
  return j;
}
// run an API action; show the server's message as a toast if it fails
async function act(fn) { try { return await fn(); } catch (e) { if (e.status !== 401) toast(e.message); return undefined; } }
function setSession(token) { AUTH.token = token; LS.set('token', token); stopLive(); if (token) setTimeout(() => { startLive(); startWatch(); }, 0); }
function onSessionExpired() {
  stopLive(); stopWatch();
  AUTH.token = ''; LS.set('token', '');
  if (!document.getElementById('ob')) { toast('Please sign in again'); closeAllLayers(); openOnboarding(); }
}
let syncBusy = false, syncSig = '', syncFirst = true, syncAgain = false;
async function syncNow(force) {
  if (!live()) return false;
  if (syncBusy) { syncAgain = true; return false; }          // something changed while syncing: run once more right after
  syncBusy = true;
  try { applySync(await api('GET', '/sync?lat=' + S.loc.lat + '&lng=' + S.loc.lng + '&radius=' + S.settings.radius), force); return true; }
  catch (e) { return false; }
  finally { syncBusy = false; if (syncAgain) { syncAgain = false; setTimeout(() => syncNow(), 0); } }
}
function applySync(d, force) {
  const first = syncFirst; syncFirst = false;
  Object.assign(CFG, d.config);
  S.uid = d.me.id;
  const roleKey = () => ROLE() + ':' + (myHosp() ? myHosp().status : '') + ':' + !!(S.profile && S.profile.donor);
  const before = roleKey();
  S.profile = Object.assign({}, S.profile || {}, d.me.profile, { role: d.me.role || 'user', roleSet: !!d.me.roleSet, donor: !!d.me.donor, hospital: d.me.hospital || null, cert: d.me.cert || null });
  if (before !== roleKey()) setTimeout(() => { renderTabs(); if (!tabsNow().some(x => x[0] === S.ui.tab)) gotoTab('home'); }, 0);
  S.verify = Object.assign({}, d.me.verify || { status: 'none' }, { ok: d.me.verified !== false, need: d.me.verifyNeed || '', locked: !!d.me.docLocked }); S.documents = d.me.documents || [];
  S.organ = Object.assign({ pledged: false, organs: [], tissues: [], kin: {}, witness: {}, informed: false, notto: false, living: {} }, d.me.organ || {});
  S.donations = d.donations; S.reqs = d.mine; S.offers = d.offers; S.camps = d.camps.filter(c => c.registered).map(c => c.id);
  World.donors = d.donors.map(x => Object.assign({ online: true, phone: '' }, x));
  World.banks = d.banks; World.centres = d.centres; World.feed = d.feed;
  World.camps = d.camps.map(c => Object.assign({}, c, { date: parseDay(c.date) }));
  ['profile', 'verify', 'organ', 'donations', 'reqs', 'offers', 'camps'].forEach(save);
  const sig = JSON.stringify([d.me, d.mine, d.offers, d.feed.map(f => [f.id, f.status, f.responders]), d.camps, d.banks, d.centres, d.donations, d.unread, d.donors.length, d.config]);
  const changed = force || sig !== syncSig; syncSig = sig;
  if (d.unread > (S.unread || 0) && !first) newNoticeToast();
  S.unread = d.unread;
  if (changed) refreshActive();
  if (S.ui.tab === 'map' && MAP) syncMap(changed);
  if (hospOK()) loadHosp();
}
function newNoticeToast() {
  api('GET', '/notifications').then(r => { const n = (r.items || []).find(x => !x.read); if (n) { toast(n.title + (n.body ? ' - ' + n.body : '')); buzz(60); } }).catch(() => {});
}
function sendPresence() {
  if (!live() || !S.profile) return Promise.resolve(null);
  LIVE.lastSent = Date.now();
  return api('PUT', '/me/presence', { available: !!S.profile.available, lat: S.loc.lat, lng: S.loc.lng }).catch(() => null);
}

/* ---- real time: one open stream (server-sent events) pushes donors moving and new alerts the moment they happen;
        a GPS watch reports my own position while I am available. The 12 s polling stays as a safety net. ---- */
const LIVE = { on: false, ac: null, retry: 0, timer: 0, lastSent: 0, watch: null, soon: 0 };
async function startLive() {
  if (!live() || LIVE.ac || document.hidden) return;
  const ac = LIVE.ac = new AbortController();
  try {
    const r = await fetch(API + '/api/live?lat=' + S.loc.lat + '&lng=' + S.loc.lng, { headers: { Authorization: 'Bearer ' + AUTH.token }, signal: ac.signal });
    if (r.status === 401) { LIVE.ac = null; return onSessionExpired(); }
    if (!r.ok || !r.body) throw new Error('no stream');
    LIVE.on = true; LIVE.retry = 0; liveBadge();
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) { const blk = buf.slice(0, i); buf = buf.slice(i + 2); liveBlock(blk); }
    }
  } catch (e) { /* connection dropped or closed on purpose */ }
  LIVE.on = false; LIVE.ac = null; liveBadge();
  if (live() && !ac.signal.aborted && !document.hidden) { LIVE.retry = Math.min(LIVE.retry + 1, 6); clearTimeout(LIVE.timer); LIVE.timer = setTimeout(startLive, 1500 * LIVE.retry); }
}
function stopLive() { clearTimeout(LIVE.timer); if (LIVE.ac) { try { LIVE.ac.abort(); } catch (e) {} } LIVE.ac = null; LIVE.on = false; }
function liveBlock(blk) {
  const ev = (blk.match(/^event: (.+)$/m) || [])[1]; if (!ev) return;
  let d = {}; try { d = JSON.parse((blk.match(/^data: (.+)$/m) || [])[1] || '{}'); } catch (e) {}
  if (ev === 'donor') {
    if (d.id === S.uid || hav(S.loc.lat, S.loc.lng, d.lat, d.lng) > S.settings.radius * 1.6) return;
    const row = Object.assign({ online: true, phone: '' }, d), i = World.donors.findIndex(x => x.id === d.id);
    if (i < 0) World.donors.push(row); else World.donors[i] = row;
    mapSoon();
  } else if (ev === 'gone') { World.donors = World.donors.filter(x => x.id !== d.id); mapSoon(); }

e is {w} kg": "தானம் செய்ய குறைந்தபட்ச எடை {w} கி.கி", "Next whole-blood donation from {date}": "அடுத்த முழு இரத்த தானம் {date} முதல்", "Not today": "இன்று வேண்டாம்", "You are likely eligible": "நீங்கள் தகுதியுடையவராக இருக்கலாம்", "Eat, hydrate, carry a photo ID, and find a camp or bank near you.": "உணவு உண்ணுங்கள், தண்ணீர் குடியுங்கள், புகைப்பட அடையாள அட்டையை எடுத்துச் செல்லுங்கள், அருகிலுள்ள முகாம் அல்லது வங்கியைத் தேடுங்கள்.", "Find a camp": "முகாமைத் தேடு", "Fever, cold, cough or sore throat in the last {n} days?": "கடந்த {n} நாட்களில் காய்ச்சல், சளி, இருமல் அல்லது தொண்டை வலி இருந்ததா?", "Wait until you have fully recovered (at least {n} days).": "முழுமையாகக் குணமாகும் வரை காத்திருங்கள் (குறைந்தது {n} நாட்கள்).", "Taking antibiotics, or any medicine for an infection?": "நோய்த்தொற்றுக்கு ஆன்டிபயாடிக் அல்லது வேறு மருந்து எடுத்துக்கொள்கிறீர்களா?", "Wait until the course is finished and you are well.": "மருந்துக் கால அளவு முடிந்து நீங்கள் நலமாகும் வரை காத்திருங்கள்.", "Tattoo, piercing or acupuncture in the last {n} months?": "கடந்த {n} மாதங்களில் பச்சை குத்துதல், காது/உடல் துளையிடுதல் அல்லது அக்குபங்சர் செய்தீர்களா?", "Wait {n} months from the procedure.": "அந்த நடைமுறையிலிருந்து {n} மாதங்கள் காத்திருங்கள்.", "Surgery, major illness or a blood transfusion in the last {n} months?": "கடந்த {n} மாதங்களில் அறுவை சிகிச்சை, பெரிய நோய் அல்லது இரத்தம் ஏற்றப்பட்டதா?", "Ask the camp doctor - usually a {n} to {n} month wait.": "முகாம் மருத்துவரிடம் கேளுங்கள் - பொதுவாக {n} முதல் {n} மாதம் காத்திருப்பு.", "Any vaccination in the last {n} weeks?": "கடந்த {n} வாரங்களில் ஏதேனும் தடுப்பூசி போடப்பட்டதா?", "Some vaccines need a short wait - ask the camp doctor.": "சில தடுப்பூசிகளுக்குச் சிறிது காத்திருப்பு தேவை - முகாம் மருத்துவரிடம் கேளுங்கள்.", "Alcohol in the last {n} hours?": "கடந்த {n} மணி நேரத்தில் மது அருந்தினீர்களா?", "Please wait {n} hours after alcohol.": "மது அருந்திய பிறகு {n} மணி நேரம் காத்திருங்கள்.", "Slept less than {n} hours last night, or not eaten today?": "நேற்றிரவு {n} மணி நேரத்திற்கும் குறைவாகத் தூங்கினீர்களா, அல்லது இன்று உண்ணவில்லையா?", "Rest and eat well first, then donate.": "முதலில் ஓய்வெடுத்து நன்றாக உண்ணுங்கள், பிறகு தானம் செய்யுங்கள்.", "Ever told you have HIV, hepatitis B or C, syphilis, or had malaria in the last {n} months?": "எச்ஐவி, ஹெபடைடிஸ் பி அல்லது சி, சிபிலிஸ் இருப்பதாகச் சொல்லப்பட்டதா, அல்லது கடந்த {n} மாதங்களில் மலேரியா வந்ததா?", "You cannot donate. Thank you for being honest - you can still help by sharing requests.": "நீங்கள் தானம் செய்ய முடியாது. நேர்மையாக இருந்ததற்கு நன்றி - கோரிக்கைகளைப் பகிர்ந்து நீங்கள் உதவலாம்.", "Heart disease, epilepsy, cancer, or uncontrolled diabetes or blood pressure?": "இதய நோய், வலிப்பு, புற்றுநோய், அல்லது கட்டுப்பாடற்ற சர்க்கரை நோய் / இரத்த அழுத்தம் உள்ளதா?", "Please do not donate without your doctor's clearance.": "உங்கள் மருத்துவரின் அனுமதி இல்லாமல் தானம் செய்ய வேண்டாம்.", "Pregnant, breastfeeding, or delivered in the last {n} months?": "கர்ப்பமாக உள்ளீர்களா, பாலூட்டுகிறீர்களா, அல்லது கடந்த {n} மாதங்களில் பிரசவித்தீர்களா?", "Please wait until at least {n} months after delivery / weaning.": "பிரசவம் / பாலூட்டல் நிறுத்தத்திற்குப் பிறகு குறைந்தது {n} மாதங்கள் காத்திருங்கள்.", "Who can donate to whom": "யார் யாருக்கு தானம் செய்யலாம்", "Compatibility chart": "பொருத்த அட்டவணை", "Red blood cell compatibility. Rows are donors, columns are recipients.": "சிவப்பணு பொருத்தம். வரிசைகள் கொடையாளர்கள், நெடுவரிசைகள் பெறுபவர்கள்.", "is the universal red-cell donor.": "அனைவருக்கும் சிவப்பணு தானம் செய்யக்கூடியவர்.", "can receive from everyone.": "அனைவரிடமிருந்தும் பெறலாம்.", "Your group <b>{bg}</b> can give to: {give}; and can receive from: {recv}.": "உங்கள் இரத்த வகை <b>{bg}</b> இவர்களுக்குக் கொடுக்கலாம்: {give}; இவர்களிடமிருந்து பெறலாம்: {recv}.", "Platelets and plasma follow different rules - the blood bank will match them.": "இரத்தத் தட்டுகள் மற்றும் பிளாஸ்மாவுக்கு வேறு விதிகள் உள்ளன - இரத்த வங்கி அவற்றைப் பொருத்தும்.", "Personal & medical details": "தனிப்பட்ட & மருத்துவ விவரங்கள்", mily": "குடும்பத்திடம் சொல்", "Edit pledge": "உறுதிமொழியைத் திருத்து", "Withdraw my pledge": "எனது உறுதிமொழியைத் திரும்பப் பெறு", "Withdraw your pledge?": "உங்கள் உறுதிமொழியைத் திரும்பப் பெறவா?", "You can pledge again any time. Please also tell your family.": "எப்போது வேண்டுமானாலும் மீண்டும் உறுதிமொழி எடுக்கலாம். உங்கள் குடும்பத்திடமும் சொல்லுங்கள்.", "Withdraw pledge": "உறுதிமொழியைத் திரும்பப் பெறு", "Keep my pledge": "என் உறுதிமொழியை வைத்திரு", "Pledge withdrawn": "உறுதிமொழி திரும்பப் பெறப்பட்டது", "One more step: register on the national portal": "இன்னும் ஒரு படி: தேசிய தளத்தில் பதிவு செய்யுங்கள்", "Your LifeLink pledge is saved. Registering on the official NOTTO portal makes it part of the national record.": "உங்கள் LifeLink உறுதிமொழி சேமிக்கப்பட்டது. அதிகாரப்பூர்வ NOTTO தளத்தில் பதிவு செய்தால் அது தேசியப் பதிவில் இடம்பெறும்.", "Registered on the national NOTTO portal": "தேசிய NOTTO தளத்தில் பதிவு செய்யப்பட்டது", "Learn & act": "அறிந்து செயல்படுங்கள்", "How deceased donation works": "இறந்தவர் உறுப்பு தானம் எவ்வாறு செயல்படுகிறது", "Living donation (kidney / liver)": "உயிருடன் தானம் (சிறுநீரகம் / கல்லீரல்)", "If a loved one has just passed away": "அன்பானவர் இப்போதுதான் இறந்துவிட்டால்", "If a loved one has passed away": "அன்பானவர் இறந்துவிட்டால்", "Transplant & eye-bank centres": "உறுப்பு மாற்று & கண் வங்கி மையங்கள்", "Myths and facts": "கட்டுக்கதைகளும் உண்மைகளும்", "Talk to your family": "உங்கள் குடும்பத்துடன் பேசுங்கள்", "NOTTO national helpline": "NOTTO தேசிய உதவி எண்", "Free, round the clock. Information on pledges, transplants and donation.": "இலவசம், 24 மணி நேரமும். உறுதிமொழிகள், உறுப்பு மாற்று, தானம் பற்றிய தகவல்.", "Open portal": "தளத்தைத் திற", "Open NOTTO portal": "NOTTO தளத்தைத் திற", "Organs can never be bought or sold - it is a serious crime. All transplants go through licensed hospitals, and deceased-donor organs are allocated by medical need, not payment.": "உறுப்புகளை வாங்கவோ விற்கவோ கூடாது - இது கடுமையான குற்றம். அனைத்து மாற்று அறுவைகளும் உரிமம் பெற்ற மருத்துவமனைகள் வழியாகவே நடக்கும்; இறந்த கொடையாளர் உறுப்புகள் மருத்துவத் தேவையின் அடிப்படையில் ஒதுக்கப்படும், பணத்தால் அல்ல.", "Register on the national portal": "தேசிய தளத்தில் பதிவு செய்", "Register on the national NOTTO portal": "தேசிய NOTTO தளத்தில் பதிவு செய்", "The Government of India's NOTTO portal issues the official donor card. It opens in your browser; use your Aadhaar or mobile number there.": "இந்திய அரசின் NOTTO தளம் அதிகாரப்பூர்வ கொடையாளர் அட்டையை வழங்குகிறது. இது உங்கள் உலாவியில் திறக்கும்; அங்கு உங்கள் ஆதார் அல்லது கைபேசி எண்ணைப் பயன்படுத்துங்கள்.", "I have registered": "நான் பதிவு செய்துவிட்டேன்", "Marked as registered": "பதிவு செய்ததாகக் குறிக்கப்பட்டது", "Organ & tissue pledge": "உறுப்பு & திசு உறுதிமொழி", "What would you like to pledge?": "எதற்கு உறுதிமொழி எடுக்க விரும்புகிறீர்கள்?", "You can change this any time.": "இதை எப்போது வேண்டுமானாலும் மாற்றலாம்.", "Organs": "உறுப்புகள்", "Tissues": "திசுக்கள்", "Heart": "இதயம்", "Lungs": "நுரையீரல்", "Liver": "கல்லீரல்", "Kidneys": "சிறுநீரகங்கள்", "Pancreas": "கணையம்", "Small intestine": "சிறுகுடல்", "Corneas": "கருவிழிகள்", "Skin": "தோல்", "Bone": "எலும்பு", "Heart valves": "இதய வால்வுகள்", "Blood vessels": "இரத்த நாளங்கள்", "Choose at least one organ or tissue": "குறைந்தது ஒரு உறுப்பு அல்லது திசுவைத் தேர்ந்தெடுக்கவும்", "Tell your family": "உங்கள் குடும்பத்திடம் சொல்லுங்கள்", "Hospitals ask your next of kin for consent. A pledge works best when your family already knows your wish.": "மருத்துவமனைகள் உங்கள் நெருங்கிய உறவினரின் ஒப்புதலைக் கேட்கும். உங்கள் விருப்பம் குடும்பத்துக்கு முன்பே தெரிந்தால் உறுதிமொழி சிறப்பாகப் பயன்படும்.", "Next of kin": "நெருங்கிய உறவினர்", "Relationship": "உறவு", "Spouse": "துணைவர்", "Parent": "பெற்றோர்", "Child": "குழந்தை", "Sibling": "உடன்பிறந்தவர்", "Other relative": "மற்ற உறவினர்", "Friend": "நண்பர்", "I have told my family about my decision": "என் முடிவை என் குடும்பத்திடம் சொல்லிவிட்டேன்", "Witness": "சாட்சி", "Enter your next of kin's name": "உங்கள் நெருங்கிய உறவினரின் பெயரை உள்ளிடவும்", "Enter a valid mobile number for your next of kin": "உங்கள் நெருங்கிய உறவினருக்கு சரியான கைபேசி எண்ணை உள்ளிடவும்", "Review and confirm": "மதிப்பாய்வு செய்து உறுதிப்படுத்து", "Pledging:": "உறுதிமொழி:", "Family informed:": "குடும்பத்துக்குத் தெரியும்:", "Not yet": "இன்னும் இல்லை", "Your identity is verified with DigiLocker. It will appear on your donor card.": "உங்கள் அடையாளம் டிஜிலாக்கரால் சரிபார்க்கப்பட்டது. இது உங்கள் கொடையாளர் அட்டையில் தோன்றும்.", "Verify your identity (recommended)": "உங்கள் அடையாளத்தைச் சரிபார்க்கவும் (பரிந்துரைக்கப்படுகிறது)", "Add a verified badge to your donor card with DigiLocker.": "டிஜிலாக்கர் மூலம் உங்கள் கொடையாளர் அட்டையில் சரிபார்க்கப்பட்ட பேட்ஜைச் சேர்க்கவும்.", "I am {n} or older. This pledge is my own free decision, and I understand my family will be asked to consent at the time.": "எனக்கு {n} வயது அல்லது அதற்கு மேல். இந்த உறுதிமொழி எனது சுயமான முடிவு; அந்த நேரத்தில் என் குடும்பத்தின் ஒப்புதல் கேட்கப்படும் என்பதை நான் புரிந்துகொள்கிறேன்.", "Confirm pledge": "உறுதிமொழியை உறுதிசெய்", "Please accept the declaration": "அறிவிப்பை ஏற்றுக்கொள்ளுங்கள்", "Pledge saved": "உறுதிமொழி சேமிக்கப்பட்டது", "Thank you": "நன்றி", "Your pledge could give someone a second chance at life.": "உங்கள் உறுதிமொழி ஒருவருக்கு வாழ்வின் இரண்டாவது வாய்ப்பைத் தரக்கூடும்.", "Tell my family": "என் குடும்பத்திடம் சொல்", "Organ & tissue donor pledge": "உறுப்பு & திசு தான உறுதிமொழி", "Most transplanted organs come from people who have died of a brain injury while on a ventilator in an ICU.": "மாற்று அறுவைக்குப் பயன்படும் பெரும்பாலான உறுப்புகள், தீவிர சிகிச்சைப் பிரிவில் வென்டிலேட்டரில் இருந்தபோது மூளைக் காயத்தால் இறந்தவர்களிடமிருந்து கிடைக்கின்றன.", "Serious brain injury": "கடுமையான மூளைக் காயம்", "The patient is treated in the ICU. Saving the patient always comes first.": "நோயாளி தீவிர சிகிச்சைப் பிரிவில் சிகிச்சை பெறுகிறார். நோயாளியைக் காப்பதே எப்போதும் முதல் முன்னுரிமை.", "Brain-stem death is certified": "மூளைத்தண்டு மரணம் சான்றளிக்கப்படுகிறது", "A board of doctors, independent of the transplant team, tests and confirms death. Brain-stem death is not a coma - there is no recovery.": "மாற்று அறுவைக் குழுவிலிருந்து சுதந்திரமான மருத்துவர் குழு சோதித்து மரணத்தை உறுதிசெய்கிறது. மூளைத்தண்டு மரணம் கோமா அல்ல - மீள்வதற்கு வாய்ப்பில்லை.", "The family is asked": "குடும்பத்திடம் கேட்கப்படுகிறது", "A hospital coordinator speaks with the next of kin and records their consent. A pledge makes this conversation much easier.": "மருத்துவமனை ஒருங்கிணைப்பாளர் நெருங்கிய உறவினருடன் பேசி அவர்களின் ஒப்புதலைப் பதிவு செய்கிறார். உறுதிமொழி இந்த உரையாடலை மிக எளிதாக்குகிறது.", "Matching and allocation": "பொருத்துதலும் ஒதுக்கீடும்", "Organs go to patients on the official waiting list through the state, regional and national transplant networks - by medical need, not payment.": "உறுப்புகள் மாநில, பிராந்திய, தேசிய மாற்று வலையமைப்புகள் மூலம் அதிகாரப்பூர்வ காத்திருப்புப் பட்டியலில் உள்ள நோயாளிகளுக்குச் செல்கின்றன - மருத்துவத் தேவையின் அடிப்படையில், பணத்தால் அல்ல.", "Retrieval and transplant": "உறுப்பு எடுத்தலும் மாற்று அறுவையும்", "Surgeons retrieve organs with care. The body is returned to the family for last rites.": "அறுவை மருத்துவர்கள் கவனமாக உறுப்புகளை எடுக்கிறார்கள். இறுதிச் சடங்குகளுக்காக உடல் குடும்பத்திடம் ஒப்படைக்கப்படுகிறது.", "Tissues such as corneas, skin and heart valves can also be donated after a normal cardiac death. Corneas should be retrieved within about {n} hours.": "இயல்பான இதய மரணத்திற்குப் பிறகும் கருவிழி, தோல், இதய வால்வுகள் போன்ற திசுக்களைத் தானம் செய்யலாம். கருவிழிகளை சுமார் {n} மணி நேரத்திற்குள் எடுக்க வேண்டும்.", "Living donation": "உயிருடன் தானம்", "A healthy person can donate one kidney, or part of the liver (which regrows), to a patient who needs it.": "ஆரோக்கியமான ஒருவர் ஒரு சிறுநீரகத்தை அல்லது கல்லீரலின் ஒரு பகுதியை (அது மீண்டும் வளரும்) தேவைப்படும் நோயாளிக்குத் தானம் செய்யலாம்.", "Who can donate?": "யார் தானம் செய்யலாம்?", "Mostly near relatives - spouse, parents, children, siblings, grandparents and grandchildren. Other donors need approval from the hospital's Authorisation Committee to confirm the donation is voluntary and unpaid.": "பெரும்பாலும் நெருங்கிய உறவினர்கள் - துணைவர், பெற்றோர், குழந்தைகள், உடன்பிறந்தோர், தாத்தா பாட்டி, பேரக்குழந்தைகள். மற்றவர்கள் தானம் தன்னார்வமானது, பணமற்றது என்பதை உறுதிப்படுத்த மருத்துவமனையின் அங்கீகாரக் குழுவின் ஒப்புதல் தேவை.", "Your checklist": "உங்கள் சரிபார்ப்புப் பட்டியல்", "Talk with your family": "உங்கள் குடும்பத்துடன் பேசுங்கள்", "Living donation is a big decision. Understand the risks, recovery time and who you are donating to.": "உயிருடன் தானம் ஒரு பெரிய முடிவு. அபாயங்கள், குணமாகும் காலம், யாருக்குத் தானம் செய்கிறீர்கள் என்பதைப் புரிந்துகொள்ளுங்கள்.", "Meet a transplant centre": "மாற்று அறுவை மையத்தைச் சந்தியுங்கள்", "Book a consultation with the hospital's transplant team. They will explain the process and your options.": "மருத்துவமனையின் மாற்று அறுவைக் குழுவுடன் ஆலோசனைக்குப் பதிவு செய்யுங்கள். அவர்கள் நடைமுறையையும் உங்கள் தேர்வுகளையும் விளக்குவார்கள்.", "Medical tests": "மருத்துவப் பரிசோதனைகள்", "Blood group, tissue matching, kidney / liver function and imaging confirm that you are a safe donor and a good match.": "இரத்த வகை, திசு பொருத்தம், சிறுநீரக / கல்லீரல் செயல்பாடு, ஸ்கேன் ஆகியவை நீங்கள் பாதுகாப்பான கொடையாளர், நல்ல பொருத்தம் என்பதை உறுதிசெய்யும்.", "Documents": "ஆவணங்கள்", "Photo ID, address proof, proof of relationship to the patient and signed consent forms.": "புகைப்பட அடையாள அட்டை, முகவரிச் சான்று, நோயாளியுடனான உறவுச் சான்று, கையொப்பமிட்ட ஒப்புதல் படிவங்கள்.", "Authorisation Committee": "அங்கீகாரக் குழு", "The hospital's committee interviews donor and recipient and approves the transplant under the law, especially when the donor is not a near relative.": "மருத்துவமனைக் குழு கொடையாளரையும் பெறுபவரையும் நேர்காணல் செய்து, குறிப்பாகக் கொடையாளர் நெருங்கிய உறவினர் அல்லாதபோது, சட்டப்படி மாற்று அறுவைக்கு ஒப்புதல் அளிக்கிறது.", "Surgery and recovery": "அறுவை சிகிச்சையும் குணமடைதலும்", "Most kidney donors return to desk work in {n} to {n} weeks. Follow-up checks continue for years.": "பெரும்பாலான சிறுநீரகக் கொடையாளர்கள் {n} முதல் {n} வாரங்களில் அலுவலக வேலைக்குத் திரும்புவார்கள். தொடர் பரிசோதனைகள் ஆண்டுகள் தொடரும்.", "Selling or buying an organ is a serious crime. Never accept or offer money, and report any broker to the police.": "உறுப்பை விற்பதும் வாங்குவதும் கடுமையான குற்றம். பணத்தை ஏற்கவோ வழங்கவோ வேண்டாம்; தரகரைக் காவல்துறையிடம் புகாரளியுங்கள்.", "Find a transplant centre": "மாற்று அறுவை மையத்தைத் தேடு", "Time matters.": "நேரம் முக்கியம்.", "Organs can only be donated in the hospital ICU, and corneas within about {n} hours.": "உறுப்புகளை மருத்துவமனை தீவிர சிகிச்சைப் பிரிவில் மட்டுமே தானம் செய்ய முடியும்; கருவிழிகளை சுமார் {n} மணி நேரத்திற்குள்.", "Tell the treating doctor now": "சிகிச்சை அளிக்கும் மருத்துவரிடம் இப்போதே சொல்லுங்கள்", "Say clearly that the family wishes to donate, and ask for the": "குடும்பம் தானம் செய்ய விரும்புகிறது என்று தெளிவாகச் சொல்லி, இவரைக் கேளுங்கள்:", "Show the pledge": "உறுதிமொழியைக் காட்டுங்கள்", "Share the LifeLink pledge card or the NOTTO donor card. The decision still rests with the family.": "LifeLink உறுதிமொழி அட்டை அல்லது NOTTO கொடையாளர் அட்டையைக் காட்டுங்கள். இறுதி முடிவு குடும்பத்திடமே உள்ளது.", "Died at home? Call an eye bank": "வீட்டில் இறந்தால்? கண் வங்கியை அழையுங்கள்", "Eyes can still be donated. Close the eyelids, place moist cotton on them, switch off fans and raise the head slightly.": "கண்களைத் தானம் செய்யலாம். இமைகளை மூடி, ஈரமான பஞ்சை வைத்து, மின்விசிறிகளை அணைத்து, தலையைச் சற்று உயர்த்துங்கள்.", "Call the national helpline": "தேசிய உதவி எண்ணை அழையுங்கள்", "NOTTO, {n}-{n}-{n}, {n} hours a day, can guide you to the nearest centre.": "NOTTO, {n}-{n}-{n}, நாள் முழுவதும், அருகிலுள்ள மையத்திற்கு வழிகாட்டும்.", "Call {n}-{n}-{n}": "அழை {n}-{n}-{n}", "Nearest centres": "அருகிலுள்ள மையங்கள்", "Show on map": "வரைபடத்தில் காட்டு", "\"Doctors will not try to save me if I am a donor.\"": "\"நான் கொடையாளராக இருந்தால் மருத்துவர்கள் என்னைக் காப்பாற்ற முயலமாட்டார்கள்.\"", "Treatment always comes first. Donation is considered only after death is certified, and the transplant team is separate from your treating doctors.": "சிகிச்சையே எப்போதும் முதலில். மரணம் சான்றளிக்கப்பட்ட பிறகே தானம் பரிசீலிக்கப்படும்; மாற்று அறுவைக் குழு உங்கள் சிகிச்சை மருத்துவர்களிடமிருந்து தனியானது.", "\"I am too old, or have a medical condition.\"": "\"எனக்கு வயதாகிவிட்டது, அல்லது மருத்துவ நிலை உள்ளது.\"", "Age alone is not a barrier. Doctors decide what can be used at the time of death, so everyone can pledge.": "வயது மட்டும் தடையல்ல. மரண நேரத்தில் எதைப் பயன்படுத்தலாம் என்பதை மருத்துவர்கள் தீர்மானிப்பார்கள்; எனவே அனைவரும் உறுதிமொழி எடுக்கலாம்.", "\"My religion does not allow it.\"": "\"என் மதம் இதை அனுமதிக்காது.\"", "Major religions in India regard organ donation as an act of charity and compassion. Speak with your own religious leader if you are unsure.": "இந்தியாவின் முக்கிய மதங்கள் உறுப்பு தானத்தை அறமாகவும் இரக்கமாகவும் கருதுகின்றன. உறுதியாகத் தெரியாவிட்டால் உங்கள் மதத் தலைவரிடம் கேளுங்கள்.", "\"The body will be disfigured.\"": "\"உடல் சிதைக்கப்படும்.\"", "Retrieval is a careful surgical procedure and the body is returned with dignity. An open casket remains possible.": "உறுப்பு எடுத்தல் கவனமான அறுவை நடைமுறை; உடல் மரியாதையுடன் ஒப்படைக்கப்படும். திறந்த பெட்டியில் வைக்கவும் முடியும்.", "\"Rich or famous people get organs first.\"": "\"பணக்காரர்கள் அல்லது பிரபலங்களுக்கே உறுப்புகள் முதலில் கிடைக்கும்.\"", "Allocation follows a waiting list and medical criteria such as blood group, urgency and size match.": "ஒதுக்கீடு காத்திருப்புப் பட்டியலையும் இரத்த வகை, அவசரம், அளவுப் பொருத்தம் போன்ற மருத்துவ அளவுகோல்களையும் பின்பற்றுகிறது.", "\"I wear glasses, so I cannot donate my eyes.\"": "\"நான் கண்ணாடி அணிகிறேன், எனவே கண்களைத் தானம் செய்ய முடியாது.\"", "Most people, including those who wear glasses or have had cataract surgery, can donate corneas.": "கண்ணாடி அணிபவர்கள் அல்லது கண்புரை அறுவை செய்தவர்கள் உட்பட பெரும்பாலானோர் கருவிழிகளைத் தானம் செய்யலாம்.", "Families almost always follow a loved one's wish when they know it. A short, calm conversation is enough.": "குடும்பங்கள் அன்பானவரின் விருப்பத்தை அறிந்தால் கிட்டத்தட்ட எப்போதும் அதைப் பின்பற்றுகின்றன. ஒரு சிறிய, அமைதியான உரையாடல் போதும்.", "You could say:": "நீங்கள் இப்படிச் சொல்லலாம்:", "\"I want to donate my organs and eyes after I die, because it can save or improve many lives. If the doctors ever ask you, please say yes. I have registered my pledge so you do not have to guess.\"": "\"நான் இறந்த பிறகு என் உறுப்புகளையும் கண்களையும் தானம் செய்ய விரும்புகிறேன், ஏனெனில் அது பல உயிர்களைக் காக்கும் அல்லது மேம்படுத்தும். மருத்துவர்கள் கேட்டால் தயவுசெய்து சரி என்று சொல்லுங்கள். நீங்கள் ஊகிக்க வேண்டியதில்லை என்பதற்காக என் உறுதிமொழியைப் பதிவு செய்துள்ளேன்.\"", "Tips": "குறிப்புகள்", "Pick a quiet moment, not a hospital corridor.": "அமைதியான நேரத்தைத் தேர்ந்தெடுங்கள், மருத்துவமனை நடைபாதை அல்ல.", "Answer questions honestly - the myths page helps.": "கேள்விகளுக்கு நேர்மையாகப் பதிலளியுங்கள் - கட்டுக்கதைகள் பக்கம் உதவும்.", "Ask them to share their own wishes too.": "அவர்களும் தங்கள் விருப்பங்களைப் பகிரச் சொல்லுங்கள்.", "Send to family": "குடும்பத்துக்கு அனுப்பு", "Apex Institute of Transplant Sciences": "அபெக்ஸ் மாற்று அறுவை அறிவியல் நிறுவனம்", "Name {n}": "பெயர் {n}", "Hall": "அரங்கம்", "Welcome": "வரவேற்கிறோம்", "Chosen": "தேர்ந்தெடுக்கப்பட்டது", "Enter a valid 10-digit mobile number": "சரியான 10 இலக்க கைபேசி எண்ணை உள்ளிடவும்", "Enter the 6-digit code": "6 இலக்க குறியீட்டை உள்ளிடவும்", "Too many codes requested. Try again in a few minutes.": "அதிகமான குறியீடுகள் கோரப்பட்டுள்ளன. சில நிமிடங்களில் மீண்டும் முயலவும்.", "Could not send the SMS. Please try again.": "SMS அனுப்ப முடியவில்லை. மீண்டும் முயலவும்.", "That code has expired. Request a new one.": "அந்தக் குறியீடு காலாவதியாகிவிட்டது. புதியதைக் கோருங்கள்.", "Too many wrong attempts. Request a new code.": "அதிகமான தவறான முயற்சிகள். புதிய குறியீட்டைக் கோருங்கள்.", "Incorrect code": "தவறான குறியீடு", "Too many attempts. Try again later.": "அதிகமான முயற்சிகள். பிறகு முயலவும்.", "This account is suspended. Contact support.": "இந்தக் கணக்கு இடைநிறுத்தப்பட்டுள்ளது. ஆதரவைத் தொடர்பு கொள்ளவும்.", "Check the date of birth": "பிறந்த தேதியைச் சரிபார்க்கவும்", "Check the weight": "எடையைச் சரிபார்க்கவும்", "Check the last donation date": "கடைசி தான தேதியைச் சரிபார்க்கவும்", "Choose a blood group": "இரத்த வகையைத் தேர்ந்தெடுக்கவும்", "Verify your ID to donate": "தானம் செய்ய உங்கள் அடையாளத்தைச் சரிபார்க்கவும்", "Your blood group is not compatible with this request": "உங்கள் இரத்த வகை இந்தக் கோரிக்கைக்குப் பொருந்தவில்லை", "You are not eligible to donate right now": "இப்போது தானம் செய்ய நீங்கள் தகுதியில்லை", "This request is no longer open": "இந்தக் கோரிக்கை இனி திறந்திருக்கவில்லை", "You cannot offer on your own request": "உங்கள் சொந்தக் கோரிக்கையில் உதவ முடியாது", "Your offer has not been accepted yet": "உங்கள் உதவி இன்னும் ஏற்கப்படவில்லை", "You already have an open request for this patient": "இந்த நோயாளிக்காக உங்களிடம் ஏற்கனவே திறந்த கோரிக்கை உள்ளது", "You have raised several requests recently. Please wait before posting another.": "சமீபத்தில் பல கோரிக்கைகளை எழுப்பியுள்ளீர்கள். மற்றொன்றை இடும் முன் காத்திருங்கள்.", "Check urgency and units": "அவசரநிலையையும் யூனிட்களையும் சரிபார்க்கவும்", "Location is required": "இருப்பிடம் தேவை", "Not your request": "இது உங்கள் கோரிக்கை அல்ல", "This camp is full": "இந்த முகாம் நிரம்பிவிட்டது", "This camp has ended": "இந்த முகாம் முடிந்துவிட்டது", "Camp not found": "முகாம் கிடைக்கவில்லை", "Next of kin is required": "நெருங்கிய உறவினர் விவரம் தேவை", "Check the date": "தேதியைச் சரிபார்க்கவும்", "Missing fields": "விவரங்கள் விடுபட்டுள்ளன", "You already have a verification under review": "உங்கள் சரிபார்ப்பு ஏற்கனவே ஆய்வில் உள்ளது", "Too many requests": "அதிகமான கோரிக்கைகள்", "LifeLink is under maintenance. Please try again soon.": "LifeLink பராமரிப்பில் உள்ளது. விரைவில் மீண்டும் முயலவும்." };

ACT.obnext = async () => {
  const s = FL.ob.s, cur = obSteps()[s.step];

  const next = () => { s.step++; frender('ob'); const sc = $('#ob .lscroll'); if (sc) sc.scrollTop = 0; };
  if (cur === 'welcome') return next();
  if (cur === 'phone') {
    if (!phoneOK(s.phone)) return toast('Enter a valid 10-digit mobile number');
    s.busy = true; frender('ob'); const ok = await sendCode(s); s.busy = false; if (ok) next(); else frender('ob'); return;
  }
  if (cur === 'otp') {

    if (!j) return frender('ob');

      enterApp(); await syncNow(true); registerPush(); if (j.user.lang !== LANG) api('PUT', '/me', { lang: LANG }).catch(() => {});

    S.profile = Object.assign({}, S.profile || {}, { phone: pr.phone }); S.verify = Object.assign({}, j.user.verify || { status: 'none' }, { ok: j.user.verified !== false && j.user.verify && j.user.verify.status === 'verified', locked: !!j.user.docLocked });
    s.role = j.user.roleSet ? j.user.role : '';
    if (j.user.roleSet && j.user.role === 'hospital') {
      const h = j.user.hospital || {};
      Object.assign(s, { hinit: true, contact: pr.name || '', name: h.name || '', type: h.type || 'Hospital', regNo: h.regNo || '', address: h.address || '', hours: h.hours || '', city: h.city || s.city });
      if (h.phone) s.phone = h.phone.replace(/^\+91/, '');
    }
    s.step = obSteps().indexOf(j.user.roleSet ? (j.user.role === 'hospital' ? 'org' : 'about') : 'role'); frender('ob'); return;
  }
  if (cur === 'role') {
    if (!s.role) return toast('Choose how you will use LifeLink');

      s.busy = true; frender('ob');
      const j = await act(() => api('PUT', '/me/role', { role: s.role === 'hospital' ? 'hospital' : 'user' }));

    }
    if (s.role === 'hospital' && !s.hinit) { s.hinit = true; s.contact = s.name || ''; s.name = ''; }
    return next();
  }
  if (cur === 'org') {
    if (s.contact.trim().length < 2) return toast('Enter your name');
    if (s.name.trim().length < 3) return toast('Enter the hospital or blood bank name');
    if (s.regNo.trim().length < 4) return toast('Enter the registration / licence number');
    if (!phoneOK(s.phone)) return toast('Enter a valid 10-digit phone number');
    return next();
  }
  if (cur === 'orgwhere') return obFinishHospital(s);
  if (cur === 'verify') {
    if (isVerified()) return obAfterVerify();
    if (DEMO) return ACT.dlstart();                       // simulated DigiLocker; its result continues the flow below
    return ACT.dlstart();
  }
  if (cur === 'about') {
    if (!s.name.trim()) return toast('Enter your name');
    if (DEMO && !phoneOK(s.phone)) return toast('Enter a valid 10-digit mobile number');
    if (!s.dob) return toast('Enter your date of birth');
    if (ageOf(s.dob) < 18) {
      s.dob = ''; s.dobErr = 'You must be 18 or older to use LifeLink. Please enter your date of birth again.';
      frender('ob'); return toast('You must be 18 or older to use LifeLink');
    }
    s.dobErr = '';
    if (!s.gender) return toast('Choose a gender');
    return next();
  }
  if (cur === 'blood') { if (!s.bg) return toast('Choose your blood group'); return next(); }
  // where: finish
  const prof = { name: s.name.trim(), dob: s.dob, gender: s.gender, city: s.city };
  if (s.bg) Object.assign(prof, { bg: s.bg, weight: s.weight ? +s.weight : '', last: s.last, donatedBefore: +s.donatedBefore || 0 });
  if (live()) {
    s.busy = true; frender('ob');
    const j = await act(() => api('PUT', '/me', Object.assign({ lang: LANG }, prof)));
    s.busy = false; if (!j) return frender('ob');
    S.profile = Object.assign({}, j.me.profile, { available: false, role: j.me.role, donor: !!j.me.donor, hospital: j.me.hospital || null }); save('profile');
    enterApp(); syncNow(true); registerPush();
  } else {
    S.profile = Object.assign({ phone: s.phone.trim(), conditions: [], available: !!s.avail, donor: !!s.avail && !!s.bg, role: 'user', lat: S.loc.lat, lng: S.loc.lng }, prof);
    save('profile'); syncEligNotice(); enterApp();
  }
  if (s.role === 'donor') setTimeout(() => ACT.becomedonor(), 700);   // chose "become a donor" at the start: go straight to the donor registration

};

const MISSION = 'LifeLink exists so that no one has to wait for blood. We connect people who need blood with willing, verified donors nearby, help hospitals and blood banks share their stock and organise camps, and encourage every healthy adult to become a voluntary donor - because every donation can save up to three lives. Blood is free, and it always will be.';
ACT.aboutus = () => infoScreen('aboutus', 'About us',
  '<div class="c mt2"><div style="width:130px;margin:0 auto">' + ILL.hero + '</div><div class="h1" style="font-size:24px">LifeLink</div><div class="sm muted">Blood & organ donation, connected</div></div>' +
  '<div class="h2">Our mission</div><div class="card"><p class="sm" style="line-height:1.6">' + MISSION + '</p></div>' +
  '<div class="h2">Our team</div><div class="col">' + TEAM.map(m =>
    '<div class="card row" style="gap:14px"><img alt="' + esc(m.name) + '" src="' + m.photo + '" style="width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--bg3)">' +
    '<div class="grow"><div class="b">' + esc(m.name) + '</div><div class="sm">' + esc(m.role) + '</div><div class="xs muted">' + esc(m.org) + '</div></div></div>').join('') + '</div>' +
  '<p class="xs muted c mt2">LifeLink is built by SAVRO.</p>');

function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = S.settings.theme === 'dark' ? '#190D0C' : '#8E1B1B';
}

  'Live': 'நேரலை', 'Before you donate': 'தானம் செய்வதற்கு முன்', 'Please read these instructions carefully. You must accept them before you can donate.': 'இந்த வழிமுறைகளை கவனமாகப் படியுங்கள். தானம் செய்ய அவற்றை ஏற்றுக்கொள்ள வேண்டும்.', 'Accept all instructions': 'அனைத்து வழிமுறைகளையும் ஏற்கிறேன்', 'Submit': 'சமர்ப்பி', 'Please accept all instructions first': 'முதலில் அனைத்து வழிமுறைகளையும் ஏற்கவும்', 'Next donation:': 'அடுத்த தானம்:', 'You can donate again after 3 months.': '3 மாதங்களுக்குப் பிறகு மீண்டும் தானம் செய்யலாம்.', 'A. Before blood donation': 'அ. இரத்த தானத்திற்கு முன்', 'B. After blood donation': 'ஆ. இரத்த தானத்திற்குப் பின்', 'C. Post-donation precautions': 'இ. தானத்திற்குப் பிந்தைய முன்னெச்சரிக்கைகள்', 'Eat light:': 'இலகுவாக உண்ணுங்கள்:', 'Have a light meal or refreshment before donating blood.': 'இரத்த தானம் செய்வதற்கு முன் இலகுவான உணவு அல்லது சிற்றுண்டி சாப்பிடுங்கள்.', 'Eligibility:': 'தகுதி:', 'Any healthy individual aged 18 years and above, weighing 50 kg or more, can donate blood.': '18 வயது மற்றும் அதற்கு மேற்பட்ட, 50 கிலோ அல்லது அதற்கு மேல் எடையுள்ள எந்த ஆரோக்கியமான நபரும் இரத்த தானம் செய்யலாம்.', 'Menstrual cycle:': 'மாதவிடாய்:', 'Women should avoid donating blood during menstruation.': 'மாதவிடாய் நேரத்தில் பெண்கள் இரத்த தானம் செய்வதைத் தவிர்க்க வேண்டும்.', 'Alcohol consumption:': 'மது அருந்துதல்:', 'If you have consumed alcohol, wait 24 hours before donating blood.': 'மது அருந்தியிருந்தால், இரத்த தானம் செய்வதற்கு 24 மணி நேரம் காத்திருக்கவும்.', 'Recent illness:': 'சமீபத்திய நோய்:', 'Avoid donating if you have had infections like jaundice, typhoid, malaria, rubella, etc. recently.': 'மஞ்சள் காமாலை, டைபாய்டு, மலேரியா, ரூபெல்லா போன்ற தொற்றுகள் சமீபத்தில் இருந்தால் தானம் செய்வதைத் தவிர்க்கவும்.', 'Surgery:': 'அறுவை சிகிச்சை:', 'If you have undergone major surgery, wait 1 year before donating blood.': 'பெரிய அறுவை சிகிச்சை செய்திருந்தால், இரத்த தானம் செய்வதற்கு 1 ஆண்டு காத்திருக்கவும்.', 'Pregnancy & lactation:': 'கர்ப்பம் மற்றும் பாலூட்டுதல்:', 'Pregnant and breastfeeding women should avoid donating blood.': 'கர்ப்பிணிகளும் பாலூட்டும் தாய்மார்களும் இரத்த தானம் செய்வதைத் தவிர்க்க வேண்டும்.', 'Vaccination & COVID-19 recovery:': 'தடுப்பூசி மற்றும் கோவிட்-19 குணமடைதல்:', 'After vaccination wait 14 days before donating blood. After recovering from COVID-19 wait 28 days before donating blood.': 'தடுப்பூசிக்குப் பிறகு 14 நாட்கள் காத்திருக்கவும். கோவிட்-19 இலிருந்து குணமடைந்த பிறகு 28 நாட்கள் காத்திருக்கவும்.', 'Restrictions before donation:': 'தானத்திற்கு முன் கட்டுப்பாடுகள்:', 'No smoking or tobacco chewing within 4 hours before donation. No tattooing or ear piercing within 1 year before donation.': 'தானத்திற்கு 4 மணி நேரத்திற்குள் புகைபிடித்தல் அல்லது புகையிலை மெல்லுதல் கூடாது. தானத்திற்கு 1 ஆண்டுக்குள் பச்சை குத்துதல் அல்லது காது குத்துதல் கூடாது.', 'Rest first:': 'முதலில் ஓய்வு:', 'Lie down for 3 minutes after donating blood. Sit up gradually and proceed to the refreshment area only if you feel fine.': 'இரத்த தானத்திற்குப் பிறகு 3 நிமிடங்கள் படுத்திருக்கவும். மெதுவாக எழுந்து, நன்றாக உணர்ந்தால் மட்டுமே சிற்றுண்டிப் பகுதிக்குச் செல்லவும்.', 'Apply pressure:': 'அழுத்தம் கொடுங்கள்:', 'Keep the donation arm raised for 10 minutes with firm pressure on the puncture site.': 'ஊசி குத்திய இடத்தில் உறுதியாக அழுத்தி, தானம் செய்த கையை 10 நிமிடங்கள் உயர்த்தி வைக்கவும்.', 'Refreshment:': 'சிற்றுண்டி:', 'Have some refreshments immediately after donation.': 'தானத்திற்குப் பிறகு உடனே சிற்றுண்டி சாப்பிடுங்கள்.', 'Plaster care:': 'பிளாஸ்டர் பராமரிப்பு:', 'A plaster will be applied at the blood collection site - keep it on for 5-6 hours.': 'இரத்தம் எடுத்த இடத்தில் பிளாஸ்டர் ஒட்டப்படும் - 5-6 மணி நேரம் அப்படியே வைக்கவும்.', 'Certification:': 'சான்றிதழ்:', 'Donors will receive certificates at the blood donation camp.': 'இரத்த தான முகாமில் கொடையாளர்களுக்கு சான்றிதழ்கள் வழங்கப்படும்.', 'Blood testing:': 'இரத்தப் பரிசோதனை:', 'Each donated unit will be tested for HIV 1 & 2 Ab, HBsAg, HCV Ab, MP, MF and VDRL.': 'தானம் செய்யப்பட்ட ஒவ்வொரு யூனிட்டும் HIV 1 & 2 Ab, HBsAg, HCV Ab, MP, MF மற்றும் VDRL க்காக பரிசோதிக்கப்படும்.', 'Hydration & nutrition:': 'நீர்ச்சத்து மற்றும் ஊட்டச்சத்து:', 'Drink plenty of fluids throughout the day and eat well.': 'நாள் முழுவதும் அதிக அளவு திரவங்களை அருந்தி, நன்றாக உண்ணுங்கள்.', 'Avoid smoking:': 'புகைபிடிப்பதைத் தவிர்க்கவும்:', 'Refrain from smoking for at least 30 minutes post-donation.': 'தானத்திற்குப் பிறகு குறைந்தது 30 நிமிடங்கள் புகைபிடிக்க வேண்டாம்.', 'No strenuous activities:': 'கடினமான செயல்கள் வேண்டாம்:', 'Avoid heavy exercise, sports or intense physical work for the rest of the day.': 'அன்றைய நாள் முழுவதும் கடுமையான உடற்பயிற்சி, விளையாட்டு அல்லது கடின உடல் உழைப்பைத் தவிர்க்கவும்.', 'Bleeding management:': 'இரத்தக்கசிவு கையாளுதல்:', 'If the puncture site bleeds, apply pressure and keep your arm raised for a few minutes.': 'ஊசி குத்திய இடத்தில் இரத்தம் கசிந்தால், அழுத்தம் கொடுத்து கையை சில நிமிடங்கள் உயர்த்தி வைக்கவும்.', 'Swelling or discoloration:': 'வீக்கம் அல்லது நிறமாற்றம்:', 'If you notice swelling, pain or bluish discoloration, apply ice - it should subside in 2-3 days.': 'வீக்கம், வலி அல்லது நீல நிறமாற்றம் தெரிந்தால் ஐஸ் வைக்கவும் - 2-3 நாட்களில் குறையும்.', 'Feeling weak or dizzy?': 'பலவீனம் அல்லது தலைசுற்றல் உணர்கிறீர்களா?', 'If you feel giddy or weak, lie down with your legs elevated or sit with your head between your knees.': 'தலைசுற்றல் அல்லது பலவீனம் உணர்ந்தால், கால்களை உயர்த்தி படுத்துக்கொள்ளவும் அல்லது தலையை முழங்கால்களுக்கு இடையில் வைத்து அமரவும்.', 'Your donor certificate': 'உங்கள் கொடையாளர் சான்றிதழ்', 'Thank you for registering as a donor. Save it, print it or share it with your family.': 'கொடையாளராக பதிவு செய்ததற்கு நன்றி. சேமிக்கவும், அச்சிடவும் அல்லது குடும்பத்தினருடன் பகிரவும்.', 'Donor certificate': 'கொடையாளர் சான்றிதழ்', 'Donor certificate & cards': 'கொடையாளர் சான்றிதழ் மற்றும் அட்டைகள்', 'Your registration certificate, blood and organ cards': 'உங்கள் பதிவுச் சான்றிதழ், இரத்த மற்றும் உறுப்பு அட்டைகள்', 'Become a donor to get yours': 'உங்களுடையதைப் பெற கொடையாளர் ஆகுங்கள்', 'CERTIFICATE OF REGISTRATION': 'பதிவுச் சான்றிதழ்', 'Voluntary Blood Donor': 'தன்னார்வ இரத்த கொடையாளர்', 'This is to certify that': 'இதன் மூலம் சான்றளிக்கப்படுவது', 'has registered as a voluntary blood donor with LifeLink and': 'LifeLink இல் தன்னார்வ இரத்த கொடையாளராகப் பதிவு செய்துள்ளார் மற்றும்', 'pledged to donate blood to help patients in need.': 'தேவையுள்ள நோயாளிகளுக்கு உதவ இரத்த தானம் செய்ய உறுதியளித்துள்ளார்.', 'Blood group': 'இரத்த வகை', 'Certificate no.': 'சான்றிதழ் எண்', 'Date of issue': 'வழங்கிய தேதி', 'Authorised signatory': 'அங்கீகரிக்கப்பட்ட கையொப்பமிடுபவர்', 'Blood is always free. Never pay or accept payment for blood or organs.': 'இரத்தம் எப்போதும் இலவசம். இரத்தத்திற்கோ உறுப்புகளுக்கோ பணம் கொடுக்கவோ பெறவோ வேண்டாம்.', 'Blood & organ donation, connected': 'இரத்த மற்றும் உறுப்பு தானம், இணைக்கப்பட்டது', 'About us': 'எங்களைப் பற்றி', 'Our mission': 'எங்கள் நோக்கம்', 'Our team': 'எங்கள் குழு', 'Our mission and team': 'எங்கள் நோக்கம் மற்றும் குழு', 'LifeLink is built by SAVRO.': 'LifeLink ஐ SAVRO உருவாக்கியுள்ளது.', 'LifeLink exists so that no one has to wait for blood. We connect people who need blood with willing, verified donors nearby, help hospitals and blood banks share their stock and organise camps, and encourage every healthy adult to become a voluntary donor - because every donation can save up to three lives. Blood is free, and it always will be.': 'யாரும் இரத்தத்திற்காக காத்திருக்கக் கூடாது என்பதற்காகவே LifeLink உள்ளது. இரத்தம் தேவைப்படுவோரை அருகிலுள்ள, சரிபார்க்கப்பட்ட கொடையாளர்களுடன் இணைக்கிறோம்; மருத்துவமனைகளும் இரத்த வங்கிகளும் தங்கள் இருப்பைப் பகிரவும் முகாம்களை நடத்தவும் உதவுகிறோம்; ஆரோக்கியமான ஒவ்வொரு வயது வந்தவரும் தன்னார்வ கொடையாளராக ஆக ஊக்குவிக்கிறோம் - ஏனெனில் ஒவ்வொரு தானமும் மூன்று உயிர்கள் வரை காப்பாற்றும். இரத்தம் இலவசம், எப்போதும் இலவசமாகவே இருக்கும்.', 'How would you like to start?': 'எப்படித் தொடங்க விரும்புகிறீர்கள்?', 'Register as a donor, get your donor certificate and help people near you.': 'கொடையாளராகப் பதிவு செய்து, சான்றிதழைப் பெற்று, அருகிலுள்ளவர்களுக்கு உதவுங்கள்.', 'Become a user': 'பயனர் ஆகுங்கள்', 'Find donors and request blood. You can become a donor later.': 'கொடையாளர்களைத் தேடி இரத்தம் கோருங்கள். பிறகு கொடையாளர் ஆகலாம்.', 'Register in two minutes and get your donor certificate': 'இரண்டு நிமிடங்களில் பதிவு செய்து கொடையாளர் சான்றிதழைப் பெறுங்கள்', 'Need blood?': 'இரத்தம் தேவையா?', 'Ask nearby donors': 'அருகிலுள்ள கொடையாளர்களிடம் கேளுங்கள்', 'Raise a request and verified donors near you are alerted.': 'கோரிக்கை பதிவிடுங்கள்; அருகிலுள்ள சரிபார்க்கப்பட்ட கொடையாளர்களுக்கு அறிவிப்பு செல்லும்.', 'Where to donate': 'எங்கே தானம் செய்வது', '{n} blood banks nearby': 'அருகில் {n} இரத்த வங்கிகள்', '{n} blood bank nearby': 'அருகில் {n} இரத்த வங்கி', '{n} blood camps nearby': 'அருகில் {n} இரத்த தான முகாம்கள்', '{n} blood camp nearby': 'அருகில் {n} இரத்த தான முகாம்', 'No blood camps scheduled nearby right now.': 'அருகில் இப்போது இரத்த தான முகாம்கள் எதுவும் திட்டமிடப்படவில்லை.', 'Blood bank': 'இரத்த வங்கி', 'You must be 18 or older to use LifeLink': 'LifeLink ஐப் பயன்படுத்த 18 வயது அல்லது அதற்கு மேல் இருக்க வேண்டும்', 'You must be 18 or older to use LifeLink. Please enter your date of birth again.': 'LifeLink ஐப் பயன்படுத்த 18 வயது அல்லது அதற்கு மேல் இருக்க வேண்டும். உங்கள் பிறந்த தேதியை மீண்டும் உள்ளிடவும்.', 'Requests at and near your hospital': 'உங்கள் மருத்துவமனையிலும் அருகிலும் உள்ள கோரிக்கைகள்', 'Blood banks (Map)': 'இரத்த வங்கிகள்', 'Save a life,': 'உயிரைக் காப்பாற்றுங்கள்,', 'give blood': 'இரத்த தானம் செய்யுங்கள்', 'Be someone\'s': 'ஒருவருக்கு', 'hero today': 'இன்று நாயகன் ஆகுங்கள்', 'Your next donation can help up to 3 people.': 'உங்கள் அடுத்த தானம் 3 பேர் வரை உதவும்.', 'Become a donor and help people near you.': 'கொடையாளர் ஆகி அருகிலுள்ளவர்களுக்கு உதவுங்கள்.', 'Become a donor': 'கொடையாளர் ஆகுங்கள்', 'See requests': 'கோரிக்கைகளைப் பார்க்க', 'Activity as': 'நீங்கள் செய்யக்கூடியவை', 'Donor mode': 'கொடையாளர் நிலை', 'Visible on the map': 'வரைபடத்தில் த
